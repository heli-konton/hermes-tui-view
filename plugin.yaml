name: tui-view
label: TUI View
version: 0.2.0
author: heli-konton
homepage: https://github.com/heli-konton/hermes-tui-view
description: >
  One hotkey (⇧⌘U) switches the focused chat into the real `hermes --tui`
  inside the Desktop terminal pane, and back. Your unsent draft rides along on
  the clipboard. Desktop-only (desktop/plugin.js, plugin SDK surface only);
  no agent tools, hooks, middleware or env vars. Needs a Hermes Desktop with
  the `host.terminal` SDK door.
tags: [desktop, tui, terminal, view]
